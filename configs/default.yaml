# =============================================================================
# TIMEFLIES CONFIGURATION
# =============================================================================

# Project name — must match a folder under data/
project: fruitfly_aging

general:
  random_state: 42

# =============================================================================
# HARDWARE
# =============================================================================
hardware:
  processor: "M"  # Options: "GPU", "CPU", "M" (Apple Silicon)
  memory_growth: true

# =============================================================================
# DATA
# =============================================================================
data:
  model: "CNN"           # Options: "CNN", "MLP", "logistic", "xgboost", "random_forest"
  tissue: "head"         # Must match subfolder under data/[project]/
  species: "drosophila"
  cell:
    column: "afca_annotation_broad"
    type: "all"          # "all" or a specific cell type from the column
  sex: "all"             # Options: "all", "male", "female"
  target_variable: "age"
  display_columns: ["age", "sex", "afca_annotation_broad"]

  batch_correction:
    enabled: false

  filtering:
    include_mixed_sex: false

  sampling:
    samples: null  # null = all samples, or integer
    variables: null  # null = all genes, or integer

  split:
    method: "random"  # Options: "random" or "column"
    # Column-based splitting (used when method="column")
    column: "genotype"
    train: ["control"]
    test: ["ab42"]

# =============================================================================
# MODEL
# =============================================================================
model:
  task_type: "classification"  # Options: "classification", "regression"

  training:
    epochs: 100
    batch_size: 32
    validation_split: 0.2
    early_stopping_patience: 8
    learning_rate: 0.001

  cnn:
    filters: [32]
    kernel_sizes: [3]
    strides: [1]
    paddings: ["same"]
    pool_sizes: [2]
    pool_strides: [2]
    dense_units: [128]
    dropout_rate: 0.5
    activation: "relu"
    loss: "categorical_crossentropy"

  mlp:
    hidden_layers: [512, 256, 128]
    activation: "relu"
    dropout_rate: 0.2
    loss: "categorical_crossentropy"

  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "mlogloss"

  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"

  logistic:
    max_iter: 1000
    C: 1.0
    penalty: "l2"
    solver: "lbfgs"

# =============================================================================
# PREPROCESSING
# =============================================================================
preprocessing:
  genes:
    remove_sex_genes: false
    remove_autosomal_genes: false
    only_keep_lnc_genes: false
    remove_lnc_genes: false
    remove_unaccounted_genes: false
    highly_variable_genes: false

  balancing:
    balance_genes: false
    balance_lnc_genes: false

  shuffling:
    shuffle_genes: false

data_processing:
  normalization:
    enabled: false

# =============================================================================
# ANALYSIS & EVALUATION
# =============================================================================
analysis:
  eda:
    enabled: false
  run_analysis_script:
    enabled: false

evaluation:
  metrics:
    training:
      classification: ["accuracy", "precision", "recall", "f1_score"]
      regression: ["mse", "mae", "r2"]
    evaluation:
      classification: ["accuracy", "f1_score", "precision", "recall", "auc", "confusion_matrix"]
      regression: ["mse", "mae", "r2", "rmse", "correlation"]
    baselines:
      enabled: true
      classification: ["random_classifier", "majority_class", "stratified_random"]
      regression: ["mean_baseline", "median_baseline"]

interpretation:
  shap:
    enabled: false
    load_existing: false
    reference_size: 100

visualizations:
  enabled: true

# =============================================================================
# STORAGE
# =============================================================================
storage:
  cleanup_policy:
    keep_last_n: 10
    keep_days: 30
    keep_best: true
    auto_cleanup: true
  model_saving:
    save_model_only_if_best: true
